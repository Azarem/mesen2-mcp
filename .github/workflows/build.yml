name: Build MCP host

# Every push to master and every pull request builds and tests the MCP host on all platforms.
# A release is published only when the VERSION file holds a version that has no tag yet:
# bump VERSION (for example 0.4.0 -> 0.5.0), push to master, and v0.5.0 is released.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,     os: windows-latest,  lib: MesenCore.dll }
          - { rid: linux-x64,   os: ubuntu-22.04,    lib: MesenCore.so }
          - { rid: linux-arm64, os: ubuntu-22.04-arm, lib: MesenCore.so }
          - { rid: osx-x64,     os: macos-15-intel,  lib: MesenCore.dylib }
          - { rid: osx-arm64,   os: macos-14,        lib: MesenCore.dylib }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      # ---- native emulation core (MesenCore) ------------------------------------------------
      - name: Set up MSBuild
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Build native core (Windows)
        if: runner.os == 'Windows'
        run: msbuild Mesen.sln -nologo -m -p:Configuration=Release -p:Platform=x64 -t:InteropDLL

      - name: Build native core (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qy
          sudo apt-get install -qy libsdl2-dev
          make core -j$(nproc) LTO=true STATICLINK=true SYSTEM_LIBEVDEV=false
          mkdir -p bin/${{ matrix.rid }}/Release
          cp InteropDLL/obj.${{ matrix.rid }}/${{ matrix.lib }} bin/${{ matrix.rid }}/Release/

      - name: Build native core (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install sdl2
          make core -j$(sysctl -n hw.logicalcpu)
          mkdir -p bin/${{ matrix.rid }}/Release
          cp InteropDLL/obj.${{ matrix.rid }}/${{ matrix.lib }} bin/${{ matrix.rid }}/Release/

      # ---- MCP host ----------------------------------------------------------------------------
      # The first build only unpacks the NuGet native libraries into bin/<rid>/Release, which the
      # UI project's pre-build step zips into Dependencies.zip (the makefile does the same twice).
      - name: Build MCP host
        run: |
          args="-c Release -r ${{ matrix.rid }} --self-contained false -p:OptimizeUi=true -p:SolutionDir=$GITHUB_WORKSPACE"
          dotnet build McpHost/McpHost.csproj $args || true
          dotnet publish McpHost/McpHost.csproj $args -o dist/mesen2-mcp
          cp bin/${{ matrix.rid }}/Release/${{ matrix.lib }} dist/mesen2-mcp/

      - name: Smoke test
        run: python tools/mcp_smoke_test.py dotnet dist/mesen2-mcp/MesenMcpHost.dll

      - name: Package
        run: |
          cd dist
          python -m zipfile -c ../mesen2-mcp-${{ matrix.rid }}.zip mesen2-mcp

      - uses: actions/upload-artifact@v4
        with:
          name: mesen2-mcp-${{ matrix.rid }}
          path: mesen2-mcp-${{ matrix.rid }}.zip

  # Publishes a GitHub release when VERSION has no tag yet.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Check whether this version is new
        id: version
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.version.outputs.new == 'true'
        with:
          pattern: mesen2-mcp-*
          merge-multiple: true
          path: release

      - name: Create release
        if: steps.version.outputs.new == 'true'
        run: |
          gh release create "${{ steps.version.outputs.tag }}" release/*.zip \
            --target "$GITHUB_SHA" --title "${{ steps.version.outputs.tag }}" --generate-notes
